<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Input Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Formulir Pendataan</h2>
    
    <form id="dataForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
      </div>
      
      <div class="form-group">
        <label for="alamat">Alamat:</label>
        <input type="text" id="alamat" name="alamat" placeholder="Masukkan alamat" required>
      </div>

      <div class="form-group">
        <label for="hp">Nomor HP / WhatsApp:</label>
        <input type="tel" id="hp" name="hp" placeholder="Masukkan nomor HP" required>
      </div>

      <button type="submit" id="btnSubmit">Kirim Data</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxAwYj0LnQCY6C4rw-IPPwayBemNN6Jml0zF3kJR-OLALxb5QhFASA2BWdidgfz_rFd/exec';
    const form = document.forms['dataForm'];
    const btnSubmit = document.getElementById('btnSubmit');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      // Mengubah status tombol saat mengirim
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Mengirim...';
      statusDiv.innerText = '';
      statusDiv.style.color = '#333';

      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          statusDiv.innerText = '✅ Data berhasil terkirim ke Google Sheets!';
          statusDiv.style.color = 'green';
          form.reset(); // Mengosongkan isian form
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Kirim Data';
        })
        .catch(error => {
          statusDiv.innerText = '❌ Gagal mengirim data. Silakan coba lagi.';
          statusDiv.style.color = 'red';
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Kirim Data';
        });
    });
  </script>

</body>
</html>
